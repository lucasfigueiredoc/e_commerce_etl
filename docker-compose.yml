version: '3.8'

services:
  # --- MINIO: SIMULADOR DE AZURE DATA LAKE / AWS S3 ---
  minio:
    image: quay.io/minio/minio:latest
    container_name: meu_data_lake
    ports:
      - "9000:9000"  # Porta para as APIs se conectarem (onde o Python vai falar)
      - "9001:9001"  # Porta para a interface visual no seu navegador
    environment:
      MINIO_ROOT_USER: admin_datalake
      MINIO_ROOT_PASSWORD: senha_datalake
    command: server /data --console-address ":9001"